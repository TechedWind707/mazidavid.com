<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Nsofor · Work</title>
<meta name="description" content="Projects, skills and experience of David Nsofor (Mazi David): AI tools, extensions and web apps. IT Programming at NSCC, Halifax.">
<meta property="og:title" content="David Nsofor · Work">
<meta property="og:description" content="AI tools, extensions and web apps. IT Programming at NSCC, Halifax.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<script src="/assets/eco-nav.js" data-current="work" data-default="light"></script>
<style>
/* =====================================================================
   WORK (work.mazidavid.com) — the resume as a website.
   Clean, white, scannable in 90 seconds. Olive carries the UI (tags,
   links, status). Gold appears only as fills/rules, never as text on white.
   Order mirrors a resume: intro → featured → all projects → open source →
   skills → experience. Ctrl+P prints a tidy one-column version.
   ===================================================================== */
.intro{padding:60px 0 30px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; border-bottom:1px solid var(--line)}
.intro h1{font-size:clamp(40px,5.5vw,62px)}
.intro h1 small{display:block; font:500 16px var(--mono); color:var(--muted); letter-spacing:0; margin-top:8px}
.intro .role{font-size:18px; color:var(--muted); margin:14px 0 0; max-width:60ch}
.open{display:inline-flex; gap:8px; align-items:center; margin-top:16px; font-size:14px; padding:7px 15px; border-radius:var(--r-pill); background:var(--gold); color:var(--black); font-weight:600}
.open::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--black); animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.actions{display:flex; gap:10px; flex-wrap:wrap}

section.block{padding-top:52px}
section.block > h2{font-size:30px; margin-bottom:6px}
section.block > .sub{color:var(--muted); margin:0 0 20px}

/* FEATURED: small cards (picture, title, one-line summary). Clicking one
   opens the lightbox below with everything else, so readers stop on a
   project instead of skimming a wall of bullet points. */
.featured{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px}
.fcard{display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden; cursor:pointer; font:inherit; color:inherit;
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-lg); box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.fcard:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.fcard:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.fcard .pic{aspect-ratio:16/10; background:var(--paper-2); border-bottom:4px solid var(--gold); overflow:hidden; display:grid; place-items:center}
.fcard .pic img{width:100%; height:100%; object-fit:cover; display:block}
.fcard .pic .mono{font:600 34px var(--serif); color:var(--muted)}      /* no picture → the project's initials */
.fcard .body{display:flex; flex-direction:column; gap:8px; padding:14px 16px 16px; flex:1}
.fcard .top{display:flex; justify-content:space-between; gap:8px; align-items:center}
.fcard h3{font:600 20px/1.2 var(--serif); margin:0}
.fcard p{margin:0; color:var(--muted); font-size:15px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.fcard .more{margin-top:auto; font:500 13px var(--mono); color:var(--olive-fg)}

/* LIGHTBOX: a native <dialog>. The browser gives us Escape-to-close,
   keeps keyboard focus inside it, and dims the page behind (::backdrop). */
.proj-dlg{width:min(760px, calc(100% - 32px)); max-height:calc(100% - 48px); padding:0; border:0; border-radius:var(--r-xl);
  background:var(--surface); color:var(--fg); box-shadow:var(--shadow-lift); overflow:auto}
.proj-dlg::backdrop{background:rgba(13,13,11,.62); backdrop-filter:blur(3px)}
.proj-dlg[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0; transform:translateY(12px) scale(.98)}}
.proj-dlg .hero{aspect-ratio:16/9; background:var(--paper-2); border-bottom:4px solid var(--gold)}
.proj-dlg .hero img{width:100%; height:100%; object-fit:cover; display:block}
.proj-dlg .inner{padding:22px 26px 26px; display:flex; flex-direction:column; gap:12px}
.proj-dlg .top{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; padding-right:44px}
.proj-dlg h3{font:600 clamp(26px,4vw,34px)/1.1 var(--serif); margin:0}
.proj-dlg p{margin:0; color:var(--muted)}
.proj-dlg ul{margin:0; padding-left:20px}
.proj-dlg ul li{margin:5px 0}
.proj-dlg .close{position:sticky; top:12px; float:right; margin:12px 12px -48px 0; z-index:2; width:40px; height:40px; border-radius:50%;
  border:1px solid var(--hair); background:var(--surface); color:var(--fg); font-size:20px; cursor:pointer}
.proj-dlg .close:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.stack{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:10px}
.links{display:flex; gap:16px; font:500 14px var(--mono)}
.links a{color:var(--olive-fg); text-decoration:none; border-bottom:1.5px solid var(--wash-olive)}
.links a:hover{border-color:var(--olive-fg)}
/* Status badges: one colour per state (all pass contrast on white) */
.status{display:inline-flex; align-items:center; gap:6px; font:500 12px var(--mono); padding:3px 10px; border-radius:var(--r-pill); white-space:nowrap; text-transform:capitalize}
.status::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.st-shipped{background:var(--olive-wash); color:var(--olive-deep)}
.st-ongoing{background:var(--gold); color:var(--black)}
.st-ongoing::before{animation:pulse 2s infinite}
.st-ideation{background:var(--rose-wash); color:var(--rose-deep)}
.st-halted{background:var(--paper-2); color:var(--muted); border:1px dashed var(--line)}
.school{font:500 11px var(--mono); padding:2px 8px; border-radius:var(--r-pill); border:1px solid var(--line); color:var(--muted)}
.chips.status-chips{margin-top:-4px}
.chips .chip.st{font-size:13px; padding:5px 12px}

/* filter chips for the full list */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{font:500 14px var(--sans); padding:7px 15px; border-radius:var(--r-pill); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; color:var(--fg)}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip small{font:500 12px var(--mono); color:var(--muted); margin-left:4px}
.chip.on small{color:var(--gold)}

/* all projects: compact rows that expand */
.rows{border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--surface)}
.rows details{border-bottom:1px solid var(--line)}
.rows details:last-child{border-bottom:0}
.rows summary{display:grid; grid-template-columns:1fr auto auto; gap:14px; align-items:center; padding:15px 20px; cursor:pointer; list-style:none}
.rows summary::-webkit-details-marker{display:none}
.rows summary:hover{background:var(--paper-2)}
.rows summary b{font-weight:600}
.rows summary .muted{color:var(--muted); font-weight:400; font-size:14px; margin-left:8px}
.rows .yr{font:500 13px var(--mono); color:var(--muted)}
.rows .body{padding:0 20px 18px; color:var(--muted)}
.rows .body ul{margin:6px 0; padding-left:18px}

.oss{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.oss a{display:block; text-decoration:none; padding:16px 18px; border-radius:var(--r-lg); border:1px solid var(--line); transition:border-color .2s}
.oss a:hover{border-color:var(--olive-fg)}
.oss b{font:500 14px var(--mono); color:var(--olive-deep)}
.oss span{display:block; color:var(--muted); font-size:15px; margin-top:4px}

.skills{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.skills h3{font:500 12px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px}
.skills .pills{display:flex; flex-wrap:wrap; gap:6px}

.tl{display:grid; grid-template-columns:110px 1fr; gap:4px 22px}
.tl .when{font:500 13px var(--mono); color:var(--gold-deep); padding-top:3px}
.tl .what{padding-bottom:14px; border-bottom:1px dashed var(--line); margin-bottom:10px}
.tl .what b{display:block}
.tl .what span{color:var(--muted)}

.cta{margin-top:60px; padding:34px; border-radius:var(--r-xl); background:#0D0D0B; color:#fff; border:1px solid var(--hair); display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between}
.cta h2{font:500 30px var(--serif); margin:0}
.cta h2 em{color:var(--gold)}
.cta .btn{border-color:#fff; color:#fff}
.cta .btn.gold{color:var(--black); border-color:var(--gold)}

@media (max-width:820px){ .intro{grid-template-columns:1fr} .oss,.skills{grid-template-columns:1fr} .proj-dlg .inner{padding:18px} .tl{grid-template-columns:1fr} .rows summary{grid-template-columns:1fr auto} .rows .yr{display:none} }
@media print{
  .eco-bar,.actions,.open,.chips,.cta,.site-foot{display:none !important}
  .card,.fcard{box-shadow:none} .proj-dlg{display:none}
  .rows details > *:not(summary){display:block}
  section.block{padding-top:16px; break-inside:avoid}
}
</style>
</head>
<body>

<main class="wrap">
  <header class="intro">
    <div>
      <p class="eyebrow" id="loc"></p>
      <h1 class="h-serif" id="name"></h1>
      <p class="role" id="role"></p>
      <span class="open" id="open"></span>
    </div>
    <div class="actions" id="actions"></div>
  </header>

  <section class="block">
    <h2 class="h-serif">Featured work</h2>
    <p class="sub">Click to expand details.</p>
    <div class="featured" id="featured"></div>
    <dialog class="proj-dlg" id="projDlg" aria-labelledby="dlgTitle">
      <button class="close" type="button" id="dlgClose" aria-label="Close">×</button>
      <div id="dlgBody"></div>
    </dialog>
  </section>

  <section class="block">
    <h2 class="h-serif">All projects</h2>
    <p class="sub">Click a row for details. Status is live: ongoing, shipped, ideation or halted.</p>
    <div class="chips" id="chips"></div>
    <div class="chips status-chips" id="stchips"></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="block">
    <h2 class="h-serif">Open source</h2>
    <p class="sub">Other people's projects I've forked to fix or extend.</p>
    <div class="oss" id="oss"></div>
  </section>

  <section class="block">
    <h2 class="h-serif">Skills</h2>
    <div class="skills" id="skills"></div>
  </section>

  <section class="block">
    <h2 class="h-serif">Education &amp; experience</h2>
    <div class="tl" id="timeline"></div>
  </section>

  <div class="cta">
    <h2 class="h-serif">Building something? <em>Let's talk.</em></h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap" id="cta"></div>
  </div>
</main>

<footer class="site-foot"><div class="wrap" id="foot"></div></footer>

<script src="/assets/content.js"></script>
<script>
/* Everything below only READS window.SITE (content.js). Edit content there. */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = SITE.person;

/* Projects come from the database (edited at /admin). content.js is the
   fallback, so the page renders instantly and still works if the API is down. */
let PROJECTS = SITE.projects;
const badge = p => `<span class="status st-${esc(p.status)}">${esc(p.status)}</span>`;

// ---- intro + buttons ----
document.getElementById("loc").textContent = P.location;
document.getElementById("name").innerHTML = `${esc(P.fullName)}<small>aka ${esc(P.name)}</small>`;
document.getElementById("role").textContent = `${P.role}. ${P.oneLiner}`;
document.getElementById("open").textContent = P.openTo;
const buttons = `
  <a class="btn solid" href="mailto:${esc(P.email)}">Email me</a>
  ${P.resumePdf ? `<a class="btn" href="${esc(P.resumePdf)}">Resume (PDF)</a>` : ""}
  <a class="btn" href="${P.links.github}">GitHub</a>
  <a class="btn" href="${P.links.linkedin}">LinkedIn</a>`;
document.getElementById("actions").innerHTML = buttons;
document.getElementById("cta").innerHTML = `<a class="btn gold" href="mailto:${esc(P.email)}">Email me</a><a class="btn" href="${P.links.linkedin}">LinkedIn</a>`;

// ---- small builders ----
const pills = arr => arr.map(t => `<span class="tag">${esc(t)}</span>`).join("");
const linkRow = (l = {}) => {
  const out = [];
  if (l.live) out.push(`<a href="${esc(l.live)}">live ↗</a>`);
  if (l.repo) out.push(`<a href="${esc(l.repo)}">code ↗</a>`);
  if (l.post) out.push(`<a href="${esc(l.post)}">write-up ↗</a>`);
  return out.length ? `<div class="links">${out.join("")}</div>` : "";
};

// ---- featured: cards → lightbox ----
const initials = t => t.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
let FEATURED = [];
function renderFeatured() {
  FEATURED = PROJECTS.filter(p => p.featured);
  document.getElementById("featured").innerHTML = FEATURED.map((p, i) => `
    <button class="fcard" type="button" data-i="${i}" aria-haspopup="dialog">
      <div class="pic">${p.image
        ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=mono>${esc(initials(p.title))}</span>'">`
        : `<span class="mono">${esc(initials(p.title))}</span>`}</div>
      <div class="body">
        <div class="top"><span class="eyebrow" style="margin:0">${esc(p.year)} · ${esc(p.kind)}</span>${badge(p)}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.summary)}</p>
        <span class="more">Details →</span>
      </div>
    </button>`).join("");
  document.querySelectorAll(".fcard").forEach(c => c.onclick = () => openProject(Number(c.dataset.i)));
}

const dlg = document.getElementById("projDlg");
let openIndex = -1;                        // which FEATURED project is in the lightbox
function openProject(i) {
  const p = FEATURED[i];
  if (!p) return;
  openIndex = i;
  document.getElementById("dlgBody").innerHTML = `
    ${p.image ? `<div class="hero"><img src="${esc(p.image)}" alt="Screenshot of ${esc(p.title)}" onerror="this.parentNode.remove()"></div>` : ""}
    <div class="inner">
      <div class="top"><span class="eyebrow" style="margin:0">${esc(p.year)} · ${esc(p.kind)}${p.school ? " · school project" : ""}</span>${badge(p)}</div>
      <h3 id="dlgTitle">${esc(p.title)}</h3>
      <p>${esc(p.summary)}</p>
      ${p.did.length ? `<div><p class="eyebrow" style="margin:4px 0 6px">What I did</p><ul>${p.did.map(d => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      <div class="stack">${pills(p.stack)}</div>
      ${linkRow(p.links)}
    </div>`;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
document.getElementById("dlgClose").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // click on the dimmed backdrop closes it

// ---- all projects with filter chips ----
const KIND_LABEL = { all: "All", ai: "AI", extension: "Extensions", web: "Web", mobile: "Mobile", design: "Design", school: "School" };
const STATUS_LABEL = { any: "Any status", ongoing: "Ongoing", shipped: "Shipped", ideation: "Ideation", halted: "Halted" };
let filter = "all", stFilter = "any";
function renderRows() {
  const counts = PROJECTS.reduce((m, p) => (m[p.kind] = (m[p.kind] || 0) + 1, m), {});
  const stCounts = PROJECTS.reduce((m, p) => (m[p.status] = (m[p.status] || 0) + 1, m), {});
  document.getElementById("chips").innerHTML = Object.keys(KIND_LABEL)
    .filter(k => k === "all" || counts[k])
    .map(k => `<button class="chip ${filter === k ? "on" : ""}" data-k="${k}">${KIND_LABEL[k]}<small>${k === "all" ? PROJECTS.length : counts[k]}</small></button>`).join("");
  document.getElementById("stchips").innerHTML = Object.keys(STATUS_LABEL)
    .filter(k => k === "any" || stCounts[k])
    .map(k => `<button class="chip st ${stFilter === k ? "on" : ""}" data-s="${k}">${STATUS_LABEL[k]}<small>${k === "any" ? PROJECTS.length : stCounts[k]}</small></button>`).join("");
  document.querySelectorAll(".chip[data-k]").forEach(b => b.onclick = () => { filter = b.dataset.k; renderRows(); });
  document.querySelectorAll(".chip[data-s]").forEach(b => b.onclick = () => { stFilter = b.dataset.s; renderRows(); });

  const list = PROJECTS.filter(p => (filter === "all" || p.kind === filter) && (stFilter === "any" || p.status === stFilter));
  document.getElementById("rows").innerHTML = list.map(p => `
    <details>
      <summary><b>${esc(p.title)}${p.school ? ` <span class="school">school</span>` : ""}<span class="muted">${esc(p.stack.slice(0, 2).join(" · "))}</span></b>${badge(p)}<span class="yr">${esc(p.year)}</span></summary>
      <div class="body">
        ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <p>${esc(p.summary)}</p>
        ${p.did.length ? `<ul>${p.did.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
        ${linkRow(p.links)}
        <div class="stack">${pills(p.stack)}</div>
      </div>
    </details>`).join("");
}
function renderAll() { renderFeatured(); renderRows(); }
renderAll();
fetch("/api/projects")
  .then(r => r.ok ? r.json() : null)
  .then(j => { if (j?.projects?.length) { PROJECTS = j.projects; renderAll(); } })
  .catch(() => {});      // offline / API down → keep the content.js version

// ---- open source ----
document.getElementById("oss").innerHTML = SITE.contributions.map(c =>
  `<a href="${esc(c.href)}"><b>${esc(c.name)} ↗</b><span>${esc(c.what)}</span></a>`).join("");

// ---- skills ----
document.getElementById("skills").innerHTML = SITE.skills.map(g =>
  `<div class="card"><h3>${esc(g.group)}</h3><div class="pills">${g.items.map(i => `<span class="tag olive">${esc(i)}</span>`).join("")}</div></div>`).join("");

// ---- timeline ----
document.getElementById("timeline").innerHTML = (SITE.experience || []).map(t =>
  `<div class="when">${esc(t.when)}</div><div class="what"><b>${esc(t.what)}</b><span>${esc(t.where)}</span></div>`).join("");

// ---- footer ----
document.getElementById("foot").innerHTML = `
  <span>&copy; ${new Date().getFullYear()} ${esc(P.fullName)} · ${esc(P.location)}</span>
  <a href="${P.links.github}">GitHub</a><a href="${P.links.linkedin}">LinkedIn</a><a href="${P.links.blog}">Blog</a>
  <a class="right" href="https://me.mazidavid.com" style="font-family:var(--serif);font-style:italic">the less formal me →</a>`;
</script>
</body>
</html>
